<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TCE-GO Elite 2026/2027 | Plataforma de Estudos</title>
  <style>
    /* ==========================================================================
       1. VARIÁVEIS & RESET
       ========================================================================== */
    :root {
      --bg-dark: #080d1a;
      --bg-sidebar: #0f172a;
      --bg-card: #131d31;
      --bg-card-hover: #1e2c47;
      --bg-surface: #1e293b;
      --border-color: #27354f;
      --border-focus: #3b82f6;
      --primary: #2563eb;
      --primary-light: #60a5fa;
      --gold: #f59e0b;
      --gold-light: #fde68a;
      --green: #10b981;
      --green-light: #6ee7b7;
      --red: #ef4444;
      --purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --sidebar-width: 290px;
      --header-height: 60px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      /* Desativa seleção de texto em toda a página */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* Permite seleção apenas em campos editáveis */
    textarea, input, [contenteditable] {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. ESTRUTURA GERAL: SIDEBAR LATERAL + ÁREA PRINCIPAL
       ========================================================================== */
    .app-layout {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* TOPBAR MOBILE */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .btn-toggle-menu {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* SIDEBAR LATERAL FIXA */
    .app-sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      z-index: 99;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--primary-light);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .logo-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .logo-sub {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: 700;
      margin-top: 3px;
    }

    /* METAS DO GRUPO */
    .trio-goal-box {
      margin-top: 10px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 0.78rem;
    }

    .trio-goal-title {
      color: var(--gold);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .trio-countdown {
      color: var(--text-main);
      font-size: 0.74rem;
      margin-top: 3px;
    }

    /* BARRA DE PROGRESSO GLOBAL */
    .progress-section {
      margin-top: 10px;
    }

    .progress-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .progress-track {
      height: 6px;
      background: #090e1a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--green));
      width: 0%;
      transition: width 0.3s ease;
    }

    /* MENU DE NAVEGAÇÃO */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }

    .nav-group-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 800;
      color: var(--text-dim);
      padding: 10px 10px 4px;
    }

    .nav-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 3px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .nav-item-btn:hover {
      background: var(--bg-card);
      color: #fff;
    }

    .nav-item-btn.active {
      background: rgba(37, 99, 235, 0.2);
      border-color: rgba(59, 130, 246, 0.4);
      color: #fff;
      font-weight: 700;
    }

    .nav-item-btn .nav-badge {
      font-size: 0.7rem;
      background: var(--bg-surface);
      padding: 2px 6px;
      border-radius: 999px;
      color: var(--text-dim);
      font-weight: 700;
    }

    .nav-item-btn.active .nav-badge {
      background: var(--primary);
      color: #fff;
    }

    /* BACKDROP MOBILE */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 98;
    }

    /* ==========================================================================
       3. CONTEÚDO PRINCIPAL (MAIN VIEWPORT)
       ========================================================================== */
    .main-viewport {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-width: 0;
      padding: 20px 24px 60px;
    }

    /* BANNER DE RETOMADA RÁPIDA */
    .quick-resume-banner {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.15) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .quick-resume-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--primary-light);
    }

    .quick-resume-lesson {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .btn-resume {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
      text-decoration: none;
    }

    .btn-resume:hover {
      background: #1d4ed8;
    }

    /* ==========================================================================
       4. VIEW: PLAYER DO YOUTUBE & CONTROLES
       ========================================================================== */
    .view-grid-player {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      align-items: start;
    }

    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    /* BARRA DE FALLBACK & ACESSO DIRETO */
    .player-top-fallback-bar {
      background: #090e1a;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-direct-yt {
      background: #dc2626;
      color: #fff;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .btn-direct-yt:hover {
      background: #b91c1c;
    }

    .btn-custom-video {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .btn-custom-video:hover {
      color: #fff;
      border-color: var(--text-muted);
    }

    /* IFRAME 16:9 RESPONSIVO */
    .video-frame-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }

    .video-frame-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .yt-notice-box {
      padding: 8px 14px;
      background: rgba(30, 41, 59, 0.4);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .player-info-box {
      padding: 18px 20px;
    }

    .level-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lesson-title-main {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      margin: 4px 0 8px;
      line-height: 1.3;
    }

    .lesson-meta-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .meta-pill {
      background: var(--bg-surface);
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .lesson-desc-box {
      background: #090e1a;
      border-left: 3px solid var(--primary);
      padding: 12px 14px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.86rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .lesson-action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-toggle-done {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-toggle-done.done {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--green);
      color: var(--green-light);
    }

    .btn-next-lesson {
      background: var(--bg-surface);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-left: auto;
    }

    .btn-next-lesson:hover {
      border-color: var(--primary);
      color: var(--primary-light);
    }

    /* PLAYLIST LATERAL (COLUNA DIREITA) */
    .playlist-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .playlist-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .playlist-head-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #fff;
    }

    .playlist-head-count {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: 700;
    }

    .playlist-scroll {
      max-height: 540px;
      overflow-y: auto;
    }

    .playlist-item {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: background 0.15s ease;
    }

    .playlist-item:hover {
      background: var(--bg-card-hover);
    }

    .playlist-item.active {
      background: rgba(37, 99, 235, 0.18);
      border-left: 3px solid var(--primary-light);
    }

    .playlist-item-idx {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .playlist-item.done .playlist-item-idx {
      background: var(--green);
      color: #064e3b;
    }

    .playlist-item-info {
      flex: 1;
      min-width: 0;
    }

    .playlist-item-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .playlist-item.active .playlist-item-title {
      color: var(--primary-light);
    }

    .playlist-item-prof {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    /* ==========================================================================
       5. VIEW: ARENA DE DEBATES (5 TEMAS)
       ========================================================================== */
    .debates-tabs-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .debate-tab {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .debate-tab:hover {
      color: #fff;
    }

    .debate-tab.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .debate-body-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .q-card {
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
    }

    .q-title {
      font-weight: 700;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .btn-toggle-criteria {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-toggle-criteria:hover {
      color: #fff;
    }

    .q-answer-box {
      margin-top: 10px;
      background: rgba(30, 41, 59, 0.6);
      border-left: 3px solid var(--gold);
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.5;
      display: none;
    }

    .q-answer-box.open {
      display: block;
    }

    /* ==========================================================================
       6. VIEW: CRONOGRAMA 80 DIAS (CLICÁVEL)
       ========================================================================== */
    .crono-week-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
    }

    .crono-week-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .crono-day-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .crono-day-item:hover {
      border-color: var(--primary-light);
      background: var(--bg-surface);
    }

    .crono-day-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .crono-badge-go {
      background: var(--primary);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* ==========================================================================
       7. VIEW: EDITOR DE REDAÇÃO 30 LINHAS
       ========================================================================== */
    .essay-box {
      width: 100%;
      height: 480px;
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.8;
      padding: 16px;
      resize: vertical;
    }

    .essay-box:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    /* ==========================================================================
       8. RESPONSIVIDADE (MOBILE FIRST REAL)
       ========================================================================== */
    @media (max-width: 900px) {
      .view-grid-player {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .mobile-header {
        display: flex;
      }

      .app-sidebar {
        /* Em mobile a sidebar ocupa 80% da largura, máx 300px */
        width: min(80vw, 300px);
        transform: translateX(-100%);
        /* garante que não vaze em telas muito pequenas */
        overflow-x: hidden;
      }

      .app-sidebar.open {
        transform: translateX(0);
      }

      .sidebar-backdrop.active {
        display: block;
      }

      .main-viewport {
        margin-left: 0;
        padding: calc(var(--header-height) + 14px) 14px 60px;
      }

      /* Header da sidebar mais compacto em mobile */
      .sidebar-header {
        padding: 12px;
      }

      .logo-title {
        font-size: 1rem;
      }

      .logo-sub {
        font-size: 0.7rem;
      }

      .trio-goal-box {
        padding: 6px 8px;
        font-size: 0.74rem;
      }

      /* Nav items ligeiramente maiores para toque */
      .nav-item-btn {
        padding: 11px 12px;
        font-size: 0.88rem;
      }

      /* Cronograma: badge "Estudar Agora" não quebra */
      .crono-badge-go {
        white-space: nowrap;
        flex-shrink: 0;
      }

      .crono-day-item {
        gap: 8px;
      }

      /* Debates: tabs em coluna no mobile */
      .debates-tabs-row {
        flex-wrap: wrap;
      }

      .debate-tab {
        font-size: 0.8rem;
        padding: 7px 10px;
      }

      /* Player: padding menor */
      .player-info-box {
        padding: 14px;
      }

      .lesson-title-main {
        font-size: 1.05rem;
      }
    }

    /* Telas muito pequenas (≤480px) */
    @media (max-width: 480px) {
      .main-viewport {
        padding: calc(var(--header-height) + 10px) 10px 50px;
      }

      .quick-resume-banner {
        flex-direction: column;
        align-items: flex-start;
      }

      .player-top-fallback-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .lesson-action-row {
        flex-direction: column;
      }

      .btn-next-lesson {
        margin-left: 0;
      }

      .crono-week-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
    }
  </style>
</head>
<body>

  <!-- TOPBAR MOBILE -->
  <header class="mobile-header">
    <button class="btn-toggle-menu" onclick="openSidebar()">
      ☰ Menu
    </button>
    <div style="font-weight:800; font-size:0.9rem; color:#fff;">TCE-GO Elite</div>
    <div style="font-size:0.75rem; font-weight:700; color:var(--gold);" id="mobile-crono-badge">80 dias</div>
  </header>

  <!-- BACKDROP MOBILE -->
  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

  <div class="app-layout">
    
    <!-- SIDEBAR DE NAVEGAÇÃO -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="logo-badge">TCE-GO 2026/2027</div>
        <div class="logo-title">Plataforma de Estudos</div>
        <div class="logo-sub">R$ 11.862,19 • 6 VAGAS</div>

        <div class="trio-goal-box">
          <div class="trio-goal-title">🎯 Meta: 3 Vagas do Trio</div>

      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      const txt = `⏳ ${days} dias (${hours}h) até a Prova`;
      document.getElementById("sidebar-countdown").innerText = txt;
      const mob = document.getElementById("mobile-crono-badge");
      if (mob) mob.innerText = `${days} dias p/ Prova`;

    function toggleLessonDone(id) {
      completedMap[id] = !completedMap[id];

    function promptCustomVideo(lessonId) {
      const currentVal = customVideosMap[lessonId] || "";
      const promptRes = prompt(
        "Insira a URL completa do YouTube ou o ID do vídeo (11 caracteres) para personalizar esta aula:\n\nExemplo: https://www.youtube.com/watch?v=L2lXiq54qno",
        currentVal ? `https://www.youtube.com/watch?v=${currentVal}` : ""
      );

      if (promptRes !== null) {
        const trimmed = promptRes.trim();
        if (trimmed === "") {
          delete customVideosMap[lessonId];
          saveState();
          renderPlayerUI();
          alert("Vídeo resetado para o padrão original!");
          return;
        }

        let extractedId = trimmed;
        if (trimmed.includes("v=")) {
          extractedId = trimmed.split("v=")[1].split("&")[0];
        } else if (trimmed.includes("youtu.be/")) {
          extractedId = trimmed.split("youtu.be/")[1].split("?")[0];
        }

        if (extractedId.length >= 11) {
          customVideosMap[lessonId] = extractedId;
          saveState();
          renderPlayerUI();
          alert("Link de vídeo atualizado com sucesso!");
        } else {
          alert("Link inválido. Certifique-se de colar uma URL válida do YouTube.");
        }
      }
    }

    function goToNextLesson() {
      const currIdx = lessons.findIndex(l => l.id === activeLessonId);

      } else {
        alert("🎉 Você chegou ao final de todas as aulas cadastradas na plataforma!");

    }

              <button class="nav-item-btn" style="background:var(--bg-surface);" onclick="alert('Incorreto. A competência em regra é irrenunciável e vinculada.')">A) A competência é sempre discricionária e delegável irrestritamente.</button>
              <button class="nav-item-btn" style="background:var(--bg-surface);" onclick="alert('Incorreto. A forma é em regra vinculada (escrita).')">B) A forma é elemento livre e de livre escolha do gestor.</button>
              <button class="nav-item-btn" style="background:rgba(16,185,129,0.2); border:1px solid var(--green); color:var(--green-light); font-weight:800;" onclick="alert('CORRETO! A competência e a finalidade são elementos estritamente vinculados do ato.')">C) A competência e a finalidade são elementos sempre vinculados. (CORRETA)</button>
              <button class="nav-item-btn" style="background:var(--bg-surface);" onclick="alert('Incorreto. O vício de competência relativa e de forma admitem convalidação.')">D) Nenhum ato com vício admite convalidação pela Administração.</button>
            </div>
          </div>

          <div style="background:#090e1a; border:1px solid var(--border-color); border-radius:var(--radius-md); padding:16px; margin-bottom:14px;">
            <span style="font-size:0.72rem; font-weight:800; color:var(--primary-light);">QUESTÃO 2 • CONTROLE EXTERNO & CONSTITUCIONAL</span>
            <p style="color:#fff; margin:8px 0; font-size:0.95rem;">
              No tocante às competências constitucionais do Tribunal de Contas (art. 71 da CF), assinale a afirmativa verdadeira:
            </p>
            <div style="display:flex; flex-direction:column; gap:6px;">
              <button class="nav-item-btn" style="background:var(--bg-surface);" onclick="alert('Incorreto. O Tribunal de Contas APRECIA as contas do Governador emitindo parecer prévio. O julgamento político é do Legislativo.')">A) O Tribunal de Contas julga em definitivo as contas do Chefe do Poder Executivo.</button>
              <button class="nav-item-btn" style="background:rgba(16,185,129,0.2); border:1px solid var(--green); color:var(--green-light); font-weight:800;" onclick="alert('CORRETO! As decisões do Tribunal de Contas que resultem em débito ou multa têm eficácia de título executivo extrajudicial (art. 71, §3º da CF).')">B) As decisões que cominam débito ou multa possuem eficácia de título executivo. (CORRETA)</button>
              <button class="nav-item-btn" style="background:var(--bg-surface);" onclick="alert('Incorreto. O Tribunal de Contas não pode decretar prisão nem perda de direitos políticos.')">C) O Tribunal de Contas pode decretar a prisão temporária de gestores faltosos.</button>
              <button class="nav-item-btn" style="background:var(--bg-surface);" onclick="alert('Incorreto. O Tribunal de Contas integra o rol de órgãos autônomos auxiliares, não faz parte da estrutura do Poder Judiciário.')">D) O Tribunal de Contas faz parte da estrutura do Poder Judiciário.</button>
            </div>
          </div>

          <div style="background:#090e1a; border:1px solid var(--border-color); border-radius:var(--radius-md); padding:16px; margin-bottom:14px;">
            <span style="font-size:0.72rem; font-weight:800; color:var(--primary-light);">QUESTÃO 3 • NOVA LEI DE LICITAÇÕES (LEI 14.133/21)</span>
            <p style="color:#fff; margin:8px 0; font-size:0.95rem;">
              Sobre as modalidades de licitação trazidas pela Lei 14.133/2021, é correto afirmar:
            </p>
            <div style="display:flex; flex-direction:column; gap:6px;">
              <button class="nav-item-btn" style="background:var(--bg-surface);" onclick="alert('Incorreto. Tomada de preços e convite foram revogados pela Lei 14.133.')">A) A Tomada de Preços e o Convite continuam em vigor normalmente.</button>
              <button class="nav-item-btn" style="background:rgba(16,185,129,0.2); border:1px solid var(--green); color:var(--green-light); font-weight:800;" onclick="alert('CORRETO! O Diálogo Competitivo é a nova modalidade trazida para contratações complexas e inovadoras.')">B) O Diálogo Competitivo é uma nova modalidade de licitação. (CORRETA)</button>
              <button class="nav-item-btn" style="background:var(--bg-surface);" onclick="alert('Incorreto. O Leilão é modalidade para alienação de bens móveis e imóveis.')">C) O Leilão foi expressamente extinto pela nova lei.</button>
              <button class="nav-item-btn" style="background:var(--bg-surface);" onclick="alert('Incorreto. O pregão não se aplica a obras de engenharia que não sejam comuns.')">D) O Pregão pode ser utilizado para contratar obras complexas de engenharia.</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderRedacao(container) {
      const saved = localStorage.getItem(KEY_ESSAY) || "";
      container.innerHTML = `
        <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:20px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
            <h1 style="font-size:1.5rem; font-weight:800; color:#fff;">Editor de Redação FCC (30 Linhas)</h1>
            <span id="lines-badge" style="background:var(--bg-surface); padding:4px 12px; border-radius:999px; font-weight:800; color:var(--primary-light);">0 / 30 Linhas</span>
          </div>
          <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">Escreva ou cole seu rascunho de 30 linhas. O texto fica salvo automaticamente no seu navegador.</p>

          <div style="background:#090e1a; padding:12px; border-radius:var(--radius-sm); border-left:3px solid var(--gold); margin-bottom:14px; font-size:0.84rem; color:#cbd5e1;">
            <strong>🎯 Estrutura Padrão FCC:</strong><br>
            • Parágrafo 1 (Linhas 1 a 6): Introdução com contextualização e tese com 2 argumentos.<br>
            • Parágrafo 2 (Linhas 7 a 14): D1 - Aprofundamento do Argumento 1 com repertório (ex: John Rawls).<br>
            • Parágrafo 3 (Linhas 15 a 22): D2 - Aprofundamento do Argumento 2 com dados e controle social.<br>
            • Parágrafo 4 (Linhas 23 a 30): Conclusão com conectivo, síntese da tese e reflexão ética/cidadã.
          </div>

          <textarea class="essay-box" id="essay-text" placeholder="Comece sua redação aqui..." oninput="onEssayChange()">${saved}</textarea>

          <div style="display:flex; gap:10px; margin-top:12px;">
            <button class="btn-resume" onclick="localStorage.setItem(KEY_ESSAY, document.getElementById('essay-text').value); alert('Salvo no dispositivo com sucesso!')">💾 Salvar Rascunho</button>
            <button class="btn-resume" style="background:var(--bg-surface); color:#fff; border:1px solid var(--border-color);" onclick="if(confirm('Tem certeza que deseja limpar o texto?')){ document.getElementById('essay-text').value = ''; onEssayChange(); }">🗑️ Limpar</button>
          </div>
        </div>
      `;
      onEssayChange();
    }

    function onEssayChange() {
      const t = document.getElementById("essay-text");
      const b = document.getElementById("lines-badge");
      if (!t || !b) return;
      const count = t.value.split("\n").length;
      b.innerText = `${count} / 30 Linhas`;
      if (count >= 25 && count <= 30) {
        b.style.background = "var(--green)";
        b.style.color = "#064e3b";
      } else {
        b.style.background = "var(--bg-surface)";
        b.style.color = "var(--primary-light)";
      }
      localStorage.setItem(KEY_ESSAY, t.value);
    }

            <a href="https://legisla.casacivil.go.gov.br/pesquisa_legislacao/102047/lei-20756" target="_blank" class="nav-item-btn" style="background:#090e1a; color:#fff;">🏛️ Estatuto dos Servidores de GO (Lei 20.756) ↗</a>
