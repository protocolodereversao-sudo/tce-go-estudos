<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCE-GO Elite 2026/2027 | Plataforma de Estudos</title>
  <style>
    /* ==========================================================================
       1. VARIÁVEIS & RESET
       ========================================================================== */
    :root {
      --bg-dark: #080d1a;
      --bg-sidebar: #0f172a;
      --bg-card: #131d31;
      --bg-card-hover: #1e2c47;
      --bg-surface: #1e293b;
      --border-color: #27354f;
      --border-focus: #3b82f6;
      --primary: #2563eb;
      --primary-light: #60a5fa;
      --gold: #f59e0b;
      --gold-light: #fde68a;
      --green: #10b981;
      --green-light: #6ee7b7;
      --red: #ef4444;
      --purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --sidebar-width: 290px;
      --header-height: 60px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. ESTRUTURA GERAL: SIDEBAR LATERAL + ÁREA PRINCIPAL
       ========================================================================== */
    .app-layout {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* TOPBAR MOBILE (Visível apenas em telas menores que 768px) */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .btn-toggle-menu {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* SIDEBAR LATERAL FIXA */
    .app-sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 120;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-brand {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, #172554 0%, var(--bg-sidebar) 100%);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand-title span {
      font-size: 0.72rem;
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .btn-close-sidebar {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
    }

    /* CARD DE STATUS & CONTADOR NA SIDEBAR */
    .sidebar-meta-box {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(30, 41, 59, 0.3);
    }
    .target-vagas {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--green-light);
      margin-bottom: 2px;
    }
    .target-countdown {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
    }

    .prog-box {
      margin-top: 8px;
    }
    .prog-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .prog-bar {
      height: 7px;
      background: #090e1a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .prog-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, var(--green) 100%);
      width: 0%;
      transition: width 0.3s;
    }

    /* LISTA DE ITENS DA SIDEBAR */
    .sidebar-nav {
      flex: 1;
      padding: 10px 10px 30px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-group-header {
      font-size: 0.68rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      padding: 14px 10px 5px;
    }

    .nav-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-item-btn:hover {
      background: var(--bg-surface);
      color: #fff;
    }
    .nav-item-btn.active {
      background: var(--bg-card-hover);
      border-color: var(--primary);
      color: #fff;
      font-weight: 800;
    }
    .nav-badge-pill {
      margin-left: auto;
      font-size: 0.65rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-surface);
      color: var(--text-muted);
    }
    .nav-item-btn.active .nav-badge-pill {
      background: var(--primary);
      color: #fff;
    }

    /* OVERLAY PARA MOBILE */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(3px);
      z-index: 110;
    }

    /* ==========================================================================
       3. ÁREA DE CONTEÚDO PRINCIPAL (MAIN)
       ========================================================================== */
    .app-main {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 24px 30px;
      min-height: 100vh;
      max-width: 1350px;
    }

    /* CARD SUPERIOR DE RETOMADA */
    .resume-bar {
      background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%);
      border: 1px solid #3b82f6;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.2);
    }
    .resume-tag {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #93c5fd;
      letter-spacing: 0.05em;
    }
    .resume-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
    }
    .btn-resume {
      background: #fff;
      color: #1e3a8a;
      border: none;
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-resume:hover {
      background: #dbeafe;
      transform: translateY(-1px);
    }

    /* ==========================================================================
       4. PLAYER EMBEDDED RESILIENTE COM FALLBACK INTELIGENTE
       ========================================================================== */
    .view-grid-player {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      align-items: start;
    }

    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    /* Barra de Acesso e Fallback acima do vídeo */
    .player-top-fallback-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-direct-yt {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-direct-yt:hover { background: #b91c1c; }

    .btn-custom-video {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-custom-video:hover { color: #fff; }

    .video-frame-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      background: #000;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .video-frame-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .yt-notice-box {
      font-size: 0.76rem;
      color: var(--text-dim);
      margin-top: 8px;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border-left: 2px solid var(--gold);
    }

    .player-info-box {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .level-tag {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--primary-light);
    }
    .lesson-title-main {
      font-size: 1.25rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.3;
    }
    .lesson-meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 4px 0;
    }
    .meta-pill {
      background: var(--bg-surface);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .lesson-desc-box {
      background: #090e1a;
      border-left: 3px solid var(--primary);
      padding: 10px 14px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.88rem;
      color: #cbd5e1;
      margin-top: 4px;
    }

    .player-buttons-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
    }
    .btn-action {
      flex: 1;
      min-height: 42px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-done {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--green);
      color: var(--green-light);
    }
    .btn-done.completed {
      background: var(--green);
      color: #064e3b;
      font-weight: 900;
    }
    .btn-next {
      background: var(--primary);
      color: #fff;
    }
    .btn-next:hover { background: #1d4ed8; }

    /* LISTA LATERAL DE AULAS */
    .playlist-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .playlist-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
    }
    .lesson-item-card {
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lesson-item-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
    }
    .lesson-item-card.active {
      background: #172554;
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.25);
    }
    .lesson-item-card.done {
      border-left: 3px solid var(--green);
    }
    .lesson-item-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }
    .lesson-item-sub {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    /* ==========================================================================
       5. ARENA DE DEBATES (5 DEBATES)
       ========================================================================== */
    .debates-tabs-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .debate-tab {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .debate-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .debate-body-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .q-card {
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .q-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }
    .q-answer-box {
      display: none;
      background: rgba(16, 185, 129, 0.1);
      border: 1px dashed var(--green);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.85rem;
      color: var(--green-light);
    }
    .q-answer-box.open { display: block; }
    .btn-toggle-criteria {
      align-self: flex-start;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    /* ==========================================================================
       6. CRONOGRAMA 80 DIAS (TOTALMENTE CLICÁVEL)
       ========================================================================== */
    .crono-week-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .crono-week-top {
      background: var(--bg-surface);
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      justify-content: space-between;
    }
    .crono-day-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .crono-day-item:last-child { border-bottom: none; }
    .crono-day-item:hover { background: var(--bg-card-hover); }
    .crono-day-info { display: flex; flex-direction: column; gap: 2px; }
    .crono-badge-go {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    /* ==========================================================================
       7. REDAÇÃO & SIMULADOS
       ========================================================================== */
    .essay-box {
      width: 100%;
      height: 380px;
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: monospace, sans-serif;
      font-size: 0.95rem;
      line-height: 1.7;
      padding: 14px;
      resize: vertical;
      outline: none;
    }

    /* ==========================================================================
       8. RESPONSIVIDADE (MOBILE & TABLETS PEQUENOS < 768px)
       ========================================================================== */
    @media (max-width: 768px) {
      .mobile-header { display: flex; }
      .btn-close-sidebar { display: block; }
      .sidebar-backdrop.active { display: block; }

      .app-sidebar {
        transform: translateX(-100%);
      }
      .app-sidebar.open {
        transform: translateX(0);
      }

      .app-main {
        margin-left: 0;
        padding: 16px;
        padding-top: calc(var(--header-height) + 16px);
      }

      .view-grid-player {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">

    <!-- HEADER MOBILE -->
    <header class="mobile-header">
      <button class="btn-toggle-menu" onclick="openSidebar()">
        ☰ Menu da Plataforma
      </button>
      <div class="brand-title" style="text-align:right;">
        TCE-GO ELITE
        <span id="mobile-crono-badge">17/01/2027</span>
      </div>
    </header>

    <!-- BACKDROP MOBILE -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

    <!-- ==========================================================================
         SIDEBAR LATERAL PERMANENTE
         ========================================================================== -->
    <aside class="app-sidebar" id="app-sidebar">
      
      <div class="sidebar-brand">
        <div class="brand-title">
          TCE-GO 2026/2027
          <span>R$ 11.862,19 • 6 VAGAS</span>
        </div>
        <button class="btn-close-sidebar" onclick="closeSidebar()" aria-label="Fechar">✕</button>
      </div>

      <div class="sidebar-meta-box">
        <div class="target-vagas">🎯 Meta: 3 Vagas do Trio</div>
        <div class="target-countdown" id="sidebar-countdown">⏳ Calculando dias...</div>

        <div class="prog-box">
          <div class="prog-labels">
            <span>Progresso Geral</span>
            <span id="prog-pct-label">0%</span>
          </div>
          <div class="prog-bar">
            <div class="prog-bar-fill" id="prog-fill-bar"></div>
          </div>
        </div>
      </div>

      <!-- LISTA DE SEÇÕES DA PLATAFORMA -->
      <nav class="sidebar-nav">
        
        <div class="nav-group-header">📍 Início & Estudo</div>
        <button class="nav-item-btn active" id="nav-btn-home" onclick="showLevel(1)">
          <span>🏠 Sala de Aula (Player)</span>
        </button>

        <div class="nav-group-header">🎓 Trilha por Níveis</div>
        <button class="nav-item-btn" id="nav-btn-lvl-1" onclick="showLevel(1)">
          <span>📚 Nível 1: Fundamentos</span>
          <span class="nav-badge-pill" id="badge-n1">0/8</span>
        </button>
        <button class="nav-item-btn" id="nav-btn-lvl-2" onclick="showLevel(2)">
          <span>⚙️ Nível 2: Mecânica FCC</span>
          <span class="nav-badge-pill" id="badge-n2">0/8</span>
        </button>
        <button class="nav-item-btn" id="nav-btn-lvl-3" onclick="showLevel(3)">
          <span>🏛️ Nível 3: Legislação Goiás</span>
          <span class="nav-badge-pill" id="badge-n3">0/6</span>
        </button>
        <button class="nav-item-btn" id="nav-btn-lvl-4" onclick="showLevel(4)">
          <span>✍️ Nível 4: Oficina Redação</span>
          <span class="nav-badge-pill" id="badge-n4">0/5</span>
        </button>

        <div class="nav-group-header">⚔️ Prática em Trio</div>
        <button class="nav-item-btn" id="nav-btn-debates" onclick="showView('debates')">
          <span>⚔️ Arena de Debates</span>
          <span class="nav-badge-pill" style="background:#7c2d12; color:#fed7aa;">5 Temas</span>
        </button>
        <button class="nav-item-btn" id="nav-btn-cronograma" onclick="showView('cronograma')">
          <span>📅 Cronograma 80 Dias</span>
          <span class="nav-badge-pill">Clicável</span>
        </button>
        <button class="nav-item-btn" id="nav-btn-simulados" onclick="showView('simulados')">
          <span>🧠 Simulados FCC</span>
          <span class="nav-badge-pill">15 Questões</span>
        </button>
        <button class="nav-item-btn" id="nav-btn-redacao" onclick="showView('redacao')">
          <span>📝 Editor de Redação</span>
          <span class="nav-badge-pill">30 Linhas</span>
        </button>

        <div class="nav-group-header">📖 Consulta Rápida</div>
        <button class="nav-item-btn" id="nav-btn-manual" onclick="showView('manual')">
          <span>🗺️ Manual do Zero (Padeiro)</span>
        </button>
        <button class="nav-item-btn" id="nav-btn-glossario" onclick="showView('glossario')">
          <span>📖 Glossário Jurídico</span>
        </button>
        <button class="nav-item-btn" id="nav-btn-links" onclick="showView('links')">
          <span>📑 Edital & Leis Oficiais</span>
        </button>

      </nav>

    </aside>

    <!-- ==========================================================================
         ÁREA PRINCIPAL DE CONTEÚDO
         ========================================================================== -->
    <main class="app-main">

      <!-- BANNER "CONTINUAR DE ONDE PAROU" -->

    let completedMap = {};
    let customVideosMap = {};
    let activeLessonId = lessons[0].id;
    let activeLevel = 1;

    function initApp() {
      try {
        const savedDone = localStorage.getItem(KEY_DONE);
        if (savedDone) completedMap = JSON.parse(savedDone);

        const savedCustom = localStorage.getItem(KEY_CUSTOM_VIDEOS);
        if (savedCustom) customVideosMap = JSON.parse(savedCustom);

        const savedActive = localStorage.getItem(KEY_ACTIVE);
        if (savedActive && lessons.some(l => l.id === savedActive)) {
          activeLessonId = savedActive;
          const curr = lessons.find(l => l.id === activeLessonId);
          if (curr) activeLevel = curr.level;
        }
      } catch (e) {
        console.error(e);
      }

      updateProgressUI();
      updateCountdown();
      setInterval(updateCountdown, 60000);

      // Carregar o player da aula ativa
      showLevel(activeLevel, activeLessonId);
    }

    function saveState() {
      try {
        localStorage.setItem(KEY_DONE, JSON.stringify(completedMap));
        localStorage.setItem(KEY_ACTIVE, activeLessonId);
        localStorage.setItem(KEY_CUSTOM_VIDEOS, JSON.stringify(customVideosMap));
      } catch (e) {
        console.error(e);
      }
      updateProgressUI();
    }

    function updateProgressUI() {
      const total = lessons.length;
      const done = Object.keys(completedMap).filter(k => completedMap[k]).length;
      const pct = Math.round((done / total) * 100);

      document.getElementById("prog-pct-label").innerText = `${pct}% (${done}/${total})`;
      document.getElementById("prog-fill-bar").style.width = pct + "%";

      for (let i = 1; i <= 4; i++) {
        const lvlLessons = lessons.filter(l => l.level === i);
        const lvlDone = lvlLessons.filter(l => completedMap[l.id]).length;
        const b = document.getElementById("badge-n" + i);
        if (b) {
          b.innerText = `${lvlDone}/${lvlLessons.length}`;
          if (lvlDone === lvlLessons.length) {
            b.style.background = "var(--green)";
            b.style.color = "#064e3b";
            b.style.fontWeight = "800";
          }
        }
      }

      const curr = lessons.find(l => l.id === activeLessonId) || lessons[0];
      const resTitle = document.getElementById("resume-text-title");
      if (resTitle) resTitle.innerText = `${curr.levelName} • Aula: ${curr.title}`;
    }

    function updateCountdown() {
      const examDate = new Date("2027-01-17T08:00:00").getTime();
      const diff = examDate - new Date().getTime();
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      const txt = `⏳ ${days} dias (${hours}h) até a Prova`;
      document.getElementById("sidebar-countdown").innerText = txt;
      const mob = document.getElementById("mobile-crono-badge");
      if (mob) mob.innerText = `${days} dias p/ Prova`;
    }

    function resumeActiveLesson() {
      const curr = lessons.find(l => l.id === activeLessonId) || lessons[0];
      showLevel(curr.level, curr.id);
    }

    function openSidebar() {
      document.getElementById("app-sidebar").classList.add("open");
      document.getElementById("sidebar-backdrop").classList.add("active");
    }

    function closeSidebar() {
      document.getElementById("app-sidebar").classList.remove("open");
      document.getElementById("sidebar-backdrop").classList.remove("active");
    }

    function setActiveNav(btnId) {
      document.querySelectorAll(".nav-item-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById(btnId);
      if (btn) btn.classList.add("active");
    }

       VIEW: PLAYER DO NÍVEL COM SUPORTE TOTAL CONTRA ERRO 153
       ========================================================================== */
    function showLevel(lvlNum, lessonIdToSelect) {
      closeSidebar();
      activeLevel = lvlNum;
      setActiveNav("nav-btn-lvl-" + lvlNum);

      const lvlLessons = lessons.filter(l => l.level === lvlNum);

      if (lessonIdToSelect) {
        activeLessonId = lessonIdToSelect;
      } else {
        const pending = lvlLessons.find(l => !completedMap[l.id]);
        activeLessonId = pending ? pending.id : lvlLessons[0].id;
      }
      saveState();

      renderPlayerUI();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

                    🚀 Avançar para o Nível ${current.level + 1} →

    // EXTRAI O ID DO YOUTUBE DE QUALQUER URL
    function extractYouTubeId(url) {
      if (!url) return null;
      url = url.trim();
      if (url.length === 11 && !url.includes("/") && !url.includes(".")) return url;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function promptCustomVideo(lessonId) {
      const current = lessons.find(l => l.id === lessonId);
      const input = prompt(`Cole a URL ou o ID de vídeo do YouTube para a aula "${current.title}":`, customVideosMap[lessonId] || "");
      if (input !== null) {
        if (input.trim() === "") {
          delete customVideosMap[lessonId];
          saveState();
          renderPlayerUI();
          alert("Vídeo restaurado para o padrão oficial!");
        } else {
          const extracted = extractYouTubeId(input);
          if (extracted) {
            customVideosMap[lessonId] = extracted;
            saveState();
            renderPlayerUI();
            alert("Vídeo atualizado com sucesso para este aparelho!");
          } else {
            alert("Não foi possível extrair um ID válido do YouTube. Certifique-se de colar uma URL completa do YouTube.");
          }
        }
      }
    }

    function selectLesson(id) {
      activeLessonId = id;
      saveState();
      renderPlayerUI();
    }

    function toggleCompleteCurrent() {
      completedMap[activeLessonId] = !completedMap[activeLessonId];
      saveState();
      renderPlayerUI();
    }

    function nextLesson() {
      const idx = lessons.findIndex(l => l.id === activeLessonId);
      if (idx !== -1 && idx < lessons.length - 1) {
        const next = lessons[idx + 1];
        if (next.level !== activeLevel) {
          showLevel(next.level, next.id);
        } else {
          selectLesson(next.id);
        }
      } else {
        alert("🎉 Você chegou ao final de todas as aulas cadastradas na plataforma!");
      }
    }

    function onEssayChange() {
      const t = document.getElementById("essay-text");
      const b = document.getElementById("lines-badge");

      const count = t.value.split("\n").length;
      b.innerText = `${count} / 30 Linhas`;
      if (count >= 25 && count <= 30) {
        b.style.background = "var(--green)";
        b.style.color = "#064e3b";
      } else {
        b.style.background = "var(--bg-surface)";
        b.style.color = "var(--primary-light)";
      }
      localStorage.setItem(KEY_ESSAY, t.value);
    }
