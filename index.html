<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TCE-GO Elite 2026/2027 | Plataforma de Estudos</title>
  <style>
    /* ==========================================================================
       1. VARIÁVEIS & RESET
       ========================================================================== */
    :root {
      --bg-dark: #080d1a;
      --bg-sidebar: #0f172a;
      --bg-card: #131d31;
      --bg-card-hover: #1e2c47;
      --bg-surface: #1e293b;
      --border-color: #27354f;
      --border-focus: #3b82f6;
      --primary: #2563eb;
      --primary-light: #60a5fa;
      --gold: #f59e0b;
      --gold-light: #fde68a;
      --green: #10b981;
      --green-light: #6ee7b7;
      --red: #ef4444;
      --purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --sidebar-width: 290px;
      --header-height: 60px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      /* Desativa seleção de texto em toda a página */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* Permite seleção apenas em campos editáveis */
    textarea, input, [contenteditable] {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. ESTRUTURA GERAL: SIDEBAR LATERAL + ÁREA PRINCIPAL
       ========================================================================== */
    .app-layout {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* TOPBAR MOBILE */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .btn-toggle-menu {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* SIDEBAR LATERAL FIXA */
    .app-sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      z-index: 99;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--primary-light);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .logo-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .logo-sub {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: 700;
      margin-top: 3px;
    }

    /* METAS DO GRUPO */
    .trio-goal-box {
      margin-top: 10px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 0.78rem;
    }

    .trio-goal-title {
      color: var(--gold);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .trio-countdown {
      color: var(--text-main);
      font-size: 0.74rem;
      margin-top: 3px;
    }

    /* BARRA DE PROGRESSO GLOBAL */
    .progress-section {
      margin-top: 10px;
    }

    .progress-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .progress-track {
      height: 6px;
      background: #090e1a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--green));
      width: 0%;
      transition: width 0.3s ease;
    }

    /* MENU DE NAVEGAÇÃO */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }

    .nav-group-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 800;
      color: var(--text-dim);
      padding: 10px 10px 4px;
    }

    .nav-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 3px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .nav-item-btn:hover {
      background: var(--bg-card);
      color: #fff;
    }

    .nav-item-btn.active {
      background: rgba(37, 99, 235, 0.2);
      border-color: rgba(59, 130, 246, 0.4);
      color: #fff;
      font-weight: 700;
    }

    .nav-item-btn .nav-badge {
      font-size: 0.7rem;
      background: var(--bg-surface);
      padding: 2px 6px;
      border-radius: 999px;
      color: var(--text-dim);
      font-weight: 700;
    }

    .nav-item-btn.active .nav-badge {
      background: var(--primary);
      color: #fff;
    }

    /* BACKDROP MOBILE */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 98;
    }

    /* ==========================================================================
       3. CONTEÚDO PRINCIPAL (MAIN VIEWPORT)
       ========================================================================== */
    .main-viewport {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-width: 0;
      padding: 20px 24px 60px;
    }

    /* BANNER DE RETOMADA RÁPIDA */
    .quick-resume-banner {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.15) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .quick-resume-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--primary-light);
    }

    .quick-resume-lesson {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .btn-resume {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
      text-decoration: none;
    }

    .btn-resume:hover {
      background: #1d4ed8;
    }

    /* ==========================================================================
       4. VIEW: PLAYER DO YOUTUBE & CONTROLES
       ========================================================================== */
    .view-grid-player {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      align-items: start;
    }

    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    /* BARRA DE FALLBACK & ACESSO DIRETO */
    .player-top-fallback-bar {
      background: #090e1a;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-direct-yt {
      background: #dc2626;
      color: #fff;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .btn-direct-yt:hover {
      background: #b91c1c;
    }

    .btn-custom-video {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .btn-custom-video:hover {
      color: #fff;
      border-color: var(--text-muted);
    }

    /* IFRAME 16:9 RESPONSIVO */
    .video-frame-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }

    .video-frame-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .yt-notice-box {
      padding: 8px 14px;
      background: rgba(30, 41, 59, 0.4);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .player-info-box {
      padding: 18px 20px;
    }

    .level-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lesson-title-main {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      margin: 4px 0 8px;
      line-height: 1.3;
    }

    .lesson-meta-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .meta-pill {
      background: var(--bg-surface);
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .lesson-desc-box {
      background: #090e1a;
      border-left: 3px solid var(--primary);
      padding: 12px 14px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.86rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .lesson-action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-toggle-done {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-toggle-done.done {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--green);
      color: var(--green-light);
    }

    .btn-next-lesson {
      background: var(--bg-surface);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-left: auto;
    }

    .btn-next-lesson:hover {
      border-color: var(--primary);
      color: var(--primary-light);
    }

    /* PLAYLIST LATERAL (COLUNA DIREITA) */
    .playlist-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .playlist-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .playlist-head-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #fff;
    }

    .playlist-head-count {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: 700;
    }

    .playlist-scroll {
      max-height: 540px;
      overflow-y: auto;
    }

    .playlist-item {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: background 0.15s ease;
    }

    .playlist-item:hover {
      background: var(--bg-card-hover);
    }

    .playlist-item.active {
      background: rgba(37, 99, 235, 0.18);
      border-left: 3px solid var(--primary-light);
    }

    .playlist-item-idx {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .playlist-item.done .playlist-item-idx {
      background: var(--green);
      color: #064e3b;
    }

    .playlist-item-info {
      flex: 1;
      min-width: 0;
    }

    .playlist-item-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .playlist-item.active .playlist-item-title {
      color: var(--primary-light);
    }

    .playlist-item-prof {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    /* ==========================================================================
       5. VIEW: ARENA DE DEBATES (5 TEMAS)
       ========================================================================== */
    .debates-tabs-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .debate-tab {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .debate-tab:hover {
      color: #fff;
    }

    .debate-tab.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .debate-body-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .q-card {
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
    }

    .q-title {
      font-weight: 700;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .btn-toggle-criteria {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-toggle-criteria:hover {
      color: #fff;
    }

    .q-answer-box {
      margin-top: 10px;
      background: rgba(30, 41, 59, 0.6);
      border-left: 3px solid var(--gold);
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.5;
      display: none;
    }

    .q-answer-box.open {
      display: block;
    }

    /* ==========================================================================
       6. VIEW: CRONOGRAMA 80 DIAS (CLICÁVEL)
       ========================================================================== */
    .crono-week-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
    }

    .crono-week-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .crono-day-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .crono-day-item:hover {
      border-color: var(--primary-light);
      background: var(--bg-surface);
    }

    .crono-day-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .crono-badge-go {
      background: var(--primary);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* ==========================================================================
       6.1. VIEW: SIMULADO FCC INTERATIVO (QUESTÃO POR QUESTÃO)
       ========================================================================== */
    .simulado-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 22px;
    }

    .simulado-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .simulado-q-indicator {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--primary-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .simulado-quick-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }

    .simulado-num-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .simulado-num-btn:hover {
      border-color: var(--primary-light);
      color: #fff;
    }

    .simulado-num-btn.active {
      border-color: var(--primary-light);
      background: rgba(37, 99, 235, 0.35);
      color: #fff;
    }

    .simulado-num-btn.answered {
      background: #064e3b;
      border-color: var(--green);
      color: var(--green-light);
    }

    .simulado-q-box {
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 18px;
    }

    .simulado-q-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--gold);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .simulado-q-text {
      color: #fff;
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 18px;
      font-weight: 500;
      white-space: pre-line;
    }

    .simulado-options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .simulado-opt-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: #e2e8f0;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      line-height: 1.45;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.15s ease;
    }

    .simulado-opt-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
      color: #fff;
    }

    .simulado-opt-btn.selected {
      background: rgba(37, 99, 235, 0.28);
      border-color: var(--primary-light);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 0 0 1px var(--primary-light);
    }

    .simulado-opt-letter {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #090e1a;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--primary-light);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .simulado-opt-btn.selected .simulado-opt-letter {
      background: var(--primary);
      border-color: var(--primary-light);
      color: #fff;
    }

    .simulado-nav-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

          { q: "2. Quais são os 3 estágios da despesa pública orçamentária?", criteria: "1) Empenho (reserva prévia da dotação orçamentária); 2) Liquidação (verificação do direito adquirido e entrega do bem/serviço); 3) Pagamento (efetiva emissão da ordem bancária ao credor)." },

          { q: "4. O que são Restos a Pagar Processados vs Não Processados?", criteria: "Processados = despesas empenhadas e já liquidadas no exercício financeiro. Não Processados = despesas empenhadas que ainda NÃO foram liquidadas até 31 de dezembro." },

          { q: "2. Como o uso de vírgulas altera o sentido entre orações adjetivas explicativas e restritivas na FCC?", criteria: "Com vírgulas = explicativa (generaliza o atributo para todos os membros do grupo). Sem vírgulas = restritiva (restringe o atributo apenas a um subgrupo específico)." },

    // ESTADO LOCALSTORAGE
    const KEY_DONE = "tcego_done_lessons";
    const KEY_ACTIVE = "tcego_active_lesson";
    const KEY_ESSAY = "tcego_saved_essay";
    const KEY_CUSTOM_VIDEOS = "tcego_custom_videos";

    let completedMap = {};
    let customVideosMap = {};
    let activeLessonId = lessons[0].id;
    let activeLevel = 1;

    function initApp() {
      try {
        const savedDone = localStorage.getItem(KEY_DONE);
        if (savedDone) completedMap = JSON.parse(savedDone);

        const savedCustom = localStorage.getItem(KEY_CUSTOM_VIDEOS);
        if (savedCustom) customVideosMap = JSON.parse(savedCustom);

        const savedActive = localStorage.getItem(KEY_ACTIVE);
        if (savedActive && lessons.some(l => l.id === savedActive)) {
          activeLessonId = savedActive;
          const curr = lessons.find(l => l.id === activeLessonId);
          if (curr) activeLevel = curr.level;
        }
      } catch (e) {
        console.error(e);
      }

      updateProgressUI();
      updateCountdown();
      setInterval(updateCountdown, 60000);

      // Carregar a aula ativa no player
      showLevel(activeLevel, activeLessonId);
    }

    function saveState() {
      try {
        localStorage.setItem(KEY_DONE, JSON.stringify(completedMap));
        localStorage.setItem(KEY_ACTIVE, activeLessonId);
        localStorage.setItem(KEY_CUSTOM_VIDEOS, JSON.stringify(customVideosMap));
      } catch (e) {
        console.error(e);
      }
      updateProgressUI();
    }

    function updateProgressUI() {
      const total = lessons.length;
      const done = Object.keys(completedMap).filter(k => completedMap[k]).length;
      const pct = Math.round((done / total) * 100);

      document.getElementById("prog-pct-label").innerText = `${pct}% (${done}/${total})`;
      document.getElementById("prog-fill-bar").style.width = pct + "%";

      for (let i = 1; i <= 4; i++) {
        const lvlLessons = lessons.filter(l => l.level === i);
        const lvlDone = lvlLessons.filter(l => completedMap[l.id]).length;
        const b = document.getElementById("badge-n" + i);
        if (b) {
          b.innerText = `${lvlDone}/${lvlLessons.length}`;
          if (lvlDone === lvlLessons.length) {
            b.style.background = "var(--green)";
            b.style.color = "#064e3b";
            b.style.fontWeight = "800";
          }
        }
      }

      const curr = lessons.find(l => l.id === activeLessonId) || lessons[0];
      const resTitle = document.getElementById("resume-text-title");
      if (resTitle) resTitle.innerText = `${curr.levelName} • Aula: ${curr.title}`;
    }

    function updateCountdown() {
      const examDate = new Date("2027-01-17T08:00:00").getTime();
      const diff = examDate - new Date().getTime();
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      const txt = `⏳ ${days} dias (${hours}h) até a Prova`;
      document.getElementById("sidebar-countdown").innerText = txt;
      const mob = document.getElementById("mobile-crono-badge");
      if (mob) mob.innerText = `${days} dias p/ Prova`;
    }

    function resumeActiveLesson() {
      const curr = lessons.find(l => l.id === activeLessonId) || lessons[0];
      showLevel(curr.level, curr.id);
    }

    function openSidebar() {
      document.getElementById("app-sidebar").classList.add("open");
      document.getElementById("sidebar-backdrop").classList.add("active");
    }

    function closeSidebar() {
      document.getElementById("app-sidebar").classList.remove("open");
      document.getElementById("sidebar-backdrop").classList.remove("active");
    }

    function setActiveNav(btnId) {
      document.querySelectorAll(".nav-item-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById(btnId);
      if (btn) btn.classList.add("active");
    }

    /* ==========================================================================
       VIEW: PLAYER DO NÍVEL COM SUPORTE TOTAL
       ========================================================================== */
    function showLevel(lvlNum, lessonIdToSelect) {
      closeSidebar();
      activeLevel = lvlNum;
      setActiveNav("nav-btn-lvl-" + lvlNum);

      const lvlLessons = lessons.filter(l => l.level === lvlNum);

      if (lessonIdToSelect) {
        activeLessonId = lessonIdToSelect;
      } else {
        const pending = lvlLessons.find(l => !completedMap[l.id]);
        activeLessonId = pending ? pending.id : lvlLessons[0].id;
      }
      saveState();

      renderPlayerUI();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

      const isDone = !!completedMap[current.id];
      const allDone = lvlLessons.every(l => completedMap[l.id]);

      // Verificar se há vídeo personalizado pelo usuário para esta aula

            ${allDone ? `

                  <button class="btn-resume" style="background:#10b981; color:#064e3b;" onclick="showLevel(${current.level + 1})">

                    ⚔️ Ir para a Arena de Debates →
                  </button>
                `}
              </div>
            ` : ''}

            <div class="player-card">
              
              <!-- BARRA DE ACESSO DIRETO & OPÇÕES -->
              <div class="player-top-fallback-bar">
                <a href="${ytUrl}" target="_blank" rel="noopener noreferrer" class="btn-direct-yt" title="Abre o vídeo direto no YouTube se o navegador bloquear incorporação">
                  ▶ Abrir no YouTube (App / Nova Aba) ↗

                <button class="btn-custom-video" onclick="promptCustomVideo('${current.id}')" title="Cole qualquer link do YouTube desta matéria">

              <!-- IFRAME DO YOUTUBE EMBED -->

                  title="${current.title}" 
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                  referrerpolicy="strict-origin-when-cross-origin"
                  allowfullscreen>
                </iframe>
              </div>

              <div class="yt-notice-box">
                ℹ️ <strong>Dica de Estudos:</strong> Você pode assistir à videoaula embutida acima ou clicar no botão vermelho <strong>"Abrir no YouTube"</strong> para assistir em tela cheia no aplicativo sem propagandas.
              </div>

              <div class="player-info-box">
                <span class="level-tag">${current.levelName} • Aula ${lvlLessons.findIndex(l => l.id === current.id) + 1} de ${lvlLessons.length}</span>
                <h1 class="lesson-title-main">${current.title}</h1>
                
                <div class="lesson-meta-bar">
                  <span class="meta-pill">Professor(a): ${current.prof}</span>
                  <span class="meta-pill">Banca FCC</span>
                  <span class="meta-pill">TCE-GO Nível Médio</span>
                </div>

                <div class="lesson-desc-box">
                  <strong>💡 Foco na Prova:</strong> ${current.desc}
                </div>

                <div class="lesson-action-row">
                  <button class="btn-toggle-done ${isDone ? 'done' : ''}" onclick="toggleLessonDone('${current.id}')">
                    ${isDone ? '✓ Aula Concluída' : '○ Marcar como Concluída'}
                  </button>

                  <button class="btn-next-lesson" onclick="goToNextLesson()">
                    Próxima Aula →
                  </button>
                </div>
              </div>
            </div>

          </div>

          <!-- COLUNA DIREITA: PLAYLIST DO BLOCO -->
          <div>
            <div class="playlist-card">
              <div class="playlist-head">
                <span class="playlist-head-title">${current.levelName}</span>
                <span class="playlist-head-count">${lvlLessons.filter(l => completedMap[l.id]).length}/${lvlLessons.length} Feitas</span>
              </div>

              <div class="playlist-scroll">
                ${lvlLessons.map((l, idx) => {
                  const done = !!completedMap[l.id];
                  const active = l.id === current.id;
                  return `
                    <div class="playlist-item ${active ? 'active' : ''} ${done ? 'done' : ''}" onclick="selectLesson('${l.id}')">
                      <div class="playlist-item-idx">
                        ${done ? '✓' : idx + 1}
                      </div>
                      <div class="playlist-item-info">
                        <div class="playlist-item-title">${l.title}</div>
                        <div class="playlist-item-prof">${l.prof}</div>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          </div>

        </div>
      `;
    }

    function selectLesson(id) {
      activeLessonId = id;
      const curr = lessons.find(l => l.id === id);
      if (curr) activeLevel = curr.level;
      saveState();
      renderPlayerUI();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleLessonDone(id) {
      completedMap[id] = !completedMap[id];
      saveState();
      renderPlayerUI();
    }

    function promptCustomVideo(lessonId) {
      const currentVal = customVideosMap[lessonId] || "";
      const promptRes = prompt(
        "Insira a URL completa do YouTube ou o ID do vídeo (11 caracteres) para personalizar esta aula:\n\nExemplo: https://www.youtube.com/watch?v=L2lXiq54qno",
        currentVal ? `https://www.youtube.com/watch?v=${currentVal}` : ""
      );

      if (promptRes !== null) {
        const trimmed = promptRes.trim();
        if (trimmed === "") {
          delete customVideosMap[lessonId];
          saveState();
          renderPlayerUI();
          alert("Vídeo resetado para o padrão original!");
          return;
        }

        let extractedId = trimmed;
        if (trimmed.includes("v=")) {
          extractedId = trimmed.split("v=")[1].split("&")[0];
        } else if (trimmed.includes("youtu.be/")) {
          extractedId = trimmed.split("youtu.be/")[1].split("?")[0];
        }

        if (extractedId.length >= 11) {
          customVideosMap[lessonId] = extractedId;
          saveState();
          renderPlayerUI();
          alert("Link de vídeo atualizado com sucesso!");
        } else {
          alert("Link inválido. Certifique-se de colar uma URL válida do YouTube.");
        }
      }
    }

    function goToNextLesson() {
      const currIdx = lessons.findIndex(l => l.id === activeLessonId);
      if (currIdx !== -1 && currIdx < lessons.length - 1) {
        selectLesson(lessons[currIdx + 1].id);
      } else {
        alert("🎉 Você chegou ao final de todas as aulas cadastradas na plataforma!");
      }
    }

       ========================================================================== */
    function showView(viewName, param) {
      closeSidebar();
      setActiveNav("nav-btn-" + viewName);
      const container = document.getElementById("content-container");

      if (viewName === "debates") {
        renderDebates(container, param || 1);
      } else if (viewName === "cronograma") {
        renderCronograma(container);
      } else if (viewName === "simulados") {
        renderSimulados(container);
      } else if (viewName === "redacao") {
        renderRedacao(container);
      } else if (viewName === "glossario") {
        renderGlossario(container);
      } else if (viewName === "manual") {
        renderManual(container);
      } else if (viewName === "links") {
        renderLinks(container);
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderSimulados(container) {
      if (!container) container = document.getElementById("content-container");

      const totalQ = simuladoQuestions.length;
      const answeredCount = Object.keys(simuladoAnswers).length;

      // SE JÁ FINALIZOU O SIMULADO, MOSTRA A TELA DE RESULTADOS E GABARITO
      if (simuladoFinished) {
        let correctCount = 0;
        simuladoQuestions.forEach((q, idx) => {
          if (simuladoAnswers[idx] === q.correct) correctCount++;
        });

        const pct = Math.round((correctCount / totalQ) * 100);
        let feedbackTitle = "";
        let feedbackDesc = "";

        if (pct >= 85) {
          feedbackTitle = "🏆 Nível de Aprovação Excelente!";
          feedbackDesc = "Desempenho de topo da concorrência! Você e o seu trio estão no patamar necessário para disputar as 3 primeiras posições das 6 vagas do TCE-GO.";
        } else if (pct >= 70) {
          feedbackTitle = "🎯 Bom Desempenho! No Caminho Certo.";
          feedbackDesc = "Você já domina a maior parte das disciplinas. Abra o Gabarito Comentado abaixo para revisar os erros pontuais nas pegadinhas da FCC.";
        } else {
          feedbackTitle = "📚 Foco na Revisão das Bases!";
          feedbackDesc = "Aproveite para revisar as aulas dos Níveis 1 e 2 na plataforma e leia os comentários do gabarito para fixar a mecânica da FCC.";
        }

        container.innerHTML = `
          <div class="simulado-card">
            <div style="margin-bottom:18px;">
              <span style="color:var(--gold); font-size:0.75rem; font-weight:800; text-transform:uppercase;">📊 Resultado do Simulado</span>
              <h1 style="font-size:1.6rem; font-weight:900; color:#fff; margin:4px 0;">Desempenho Oficial • Banca FCC</h1>
              <p style="font-size:0.86rem; color:var(--text-muted);">Simulado concluído com 20 questões reais de Direito, AFO, LRF, Legislação de Goiás e Português.</p>
            </div>

            <div class="simulado-result-card">
              <div class="simulado-score-circle">
                <span class="simulado-score-val">${correctCount}/${totalQ}</span>
                <span class="simulado-score-pct">${pct}% Acertos</span>
              </div>
              <h2 style="font-size:1.3rem; font-weight:800; color:#fff; margin-bottom:6px;">${feedbackTitle}</h2>
              <p style="font-size:0.9rem; color:#cbd5e1; max-width:620px; margin:0 auto 18px; line-height:1.5;">${feedbackDesc}</p>

              <div class="simulado-result-buttons">
                <button class="btn-resume" style="background:var(--primary);" onclick="toggleSimuladoGabarito()">
                  ${simuladoShowGabarito ? '👁️ Ocultar Gabarito Comentado' : '👁️ Exibir Gabarito Comentado'}
                </button>
                <button class="btn-resume" style="background:#065f46; color:#a7f3d0; border:1px solid var(--green);" onclick="downloadSimuladoReport()">
                  📥 Baixar Gabarito Completo (.TXT)
                </button>
                <button class="btn-resume" style="background:var(--bg-surface); color:#fff; border:1px solid var(--border-color);" onclick="resetSimulado()">
                  🔄 Refazer Simulado do Zero
                </button>
              </div>
            </div>

            <!-- ÁREA DO GABARITO COMENTADO (EXPANSÍVEL) -->
            ${simuladoShowGabarito ? `
              <div style="margin-top:24px;">
                <h3 style="font-size:1.2rem; font-weight:800; color:#fff; margin-bottom:14px;">Gabarito Oficial & Análise Pedagógica</h3>
                ${simuladoQuestions.map((q, idx) => {
                  const userAns = simuladoAnswers[idx] || "Não respondeu";
                  const isCorrect = userAns === q.correct;
                  return `
                    <div class="gabarito-item-card">
                      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:6px;">
                        <span style="font-size:0.75rem; font-weight:800; color:var(--primary-light);">QUESTÃO ${idx + 1} DE ${totalQ} • ${q.discipline}</span>
                        <span class="gabarito-status-tag ${isCorrect ? 'correct' : 'incorrect'}">
                          ${isCorrect ? '✓ Você Acertou' : `✗ Você marcou: ${userAns} (Correta: ${q.correct})`}
                        </span>
                      </div>
                      <div style="font-size:0.92rem; color:#f1f5f9; line-height:1.5; margin-bottom:10px;">${q.question}</div>
                      
                      <div style="font-size:0.84rem; margin-bottom:10px;">
                        ${q.options.map(opt => `
                          <div style="padding:4px 8px; border-radius:4px; margin-bottom:3px; background:${opt.letter === q.correct ? 'rgba(16,185,129,0.15)' : (opt.letter === userAns ? 'rgba(239,68,68,0.15)' : 'transparent')}; color:${opt.letter === q.correct ? 'var(--green-light)' : (opt.letter === userAns ? '#fca5a5' : '#94a3b8')};">
                            <strong>${opt.letter})</strong> ${opt.text} ${opt.letter === q.correct ? '<strong>(GABARITO)</strong>' : (opt.letter === userAns ? '<strong>(SUA RESPOSTA)</strong>' : '')}
                          </div>
                        `).join("")}
                      </div>

                      <div class="gabarito-comment-box">
                        <strong>💡 Comentário do Especialista:</strong><br>
                        ${q.comment}
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            ` : ''}

          </div>
        `;
        return;
      }

      // MODO PROVA: UMA QUESTÃO POR VEZ
      const q = simuladoQuestions[currentSimuladoIndex];
      const selectedOption = simuladoAnswers[currentSimuladoIndex] || null;

      container.innerHTML = `
        <div class="simulado-card">
          
          <div class="simulado-top-bar">
            <div>
              <span class="simulado-q-indicator">Simulado Oficial FCC • Questão ${currentSimuladoIndex + 1} de ${totalQ}</span>
              <h1 style="font-size:1.35rem; font-weight:800; color:#fff; margin:2px 0;">Treino de Prova Real • Nível Médio</h1>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:0.8rem; color:var(--gold); font-weight:800;">${answeredCount}/${totalQ} respondidas</span>
              <button class="btn-resume" style="background:var(--gold); color:#000; padding:6px 12px; font-size:0.78rem;" onclick="finishSimulado()">
                🏁 Finalizar e Ver Gabarito
              </button>
            </div>
          </div>

          <!-- GRADE RÁPIDA DE QUESTÕES (1 A 20) -->
          <div class="simulado-quick-grid">
            ${simuladoQuestions.map((_, idx) => {
              const isAnswered = !!simuladoAnswers[idx];
              const isCurrent = idx === currentSimuladoIndex;
              return `
                <button class="simulado-num-btn ${isCurrent ? 'active' : ''} ${isAnswered ? 'answered' : ''}" onclick="goToSimuladoQuestion(${idx})" title="Ir para questão ${idx + 1}">
                  ${idx + 1}
                </button>
              `;
            }).join("")}
          </div>

          <!-- CARD DA QUESTÃO ATUAL -->
          <div class="simulado-q-box">
            <span class="simulado-q-tag">${q.discipline}</span>
            <div class="simulado-q-text">${q.question}</div>

            <div class="simulado-options-list">
              ${q.options.map(opt => {
                const isSelected = selectedOption === opt.letter;
                return `
                  <button class="simulado-opt-btn ${isSelected ? 'selected' : ''}" onclick="selectSimuladoOption(${currentSimuladoIndex}, '${opt.letter}')">
                    <div class="simulado-opt-letter">${opt.letter}</div>
                    <div>${opt.text}</div>
                  </button>
                `;
              }).join("")}
            </div>
          </div>

          <!-- AÇÕES DE NAVEGAÇÃO -->
          <div class="simulado-nav-actions">
            <button class="btn-resume" style="background:var(--bg-surface); color:#fff; border:1px solid var(--border-color); ${currentSimuladoIndex === 0 ? 'opacity:0.4; pointer-events:none;' : ''}" onclick="goToSimuladoQuestion(${currentSimuladoIndex - 1})">
              ← Questão Anterior
            </button>

            ${currentSimuladoIndex < totalQ - 1 ? `
              <button class="btn-resume" style="background:var(--primary);" onclick="goToSimuladoQuestion(${currentSimuladoIndex + 1})">
                Próxima Questão →
              </button>
            ` : `
              <button class="btn-resume" style="background:var(--green); color:#064e3b; font-weight:800;" onclick="finishSimulado()">
                ✓ Concluir e Exibir Gabarito
              </button>
            `}
          </div>

        </div>
      `;
    }

    function selectSimuladoOption(qIdx, optLetter) {
      simuladoAnswers[qIdx] = optLetter;
      try {
        localStorage.setItem(KEY_SIMULADO_ANSWERS, JSON.stringify(simuladoAnswers));
      } catch(e) {}
      renderSimulados();
    }

    function goToSimuladoQuestion(idx) {
      if (idx >= 0 && idx < simuladoQuestions.length) {
        currentSimuladoIndex = idx;
        renderSimulados();
        window.scrollTo({ top: 120, behavior: "smooth" });
      }
    }

    function finishSimulado() {
      const totalQ = simuladoQuestions.length;
      const answeredCount = Object.keys(simuladoAnswers).length;
      if (answeredCount < totalQ) {
        const remaining = totalQ - answeredCount;
        if (!confirm(`Você ainda não respondeu ${remaining} questão(ões). Deseja realmente finalizar o simulado e conferir o gabarito agora?`)) {
          return;
        }
      }
      simuladoFinished = true;
      try {
        localStorage.setItem(KEY_SIMULADO_FINISHED, "true");
      } catch(e) {}
      renderSimulados();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleSimuladoGabarito() {
      simuladoShowGabarito = !simuladoShowGabarito;
      renderSimulados();
    }

    function resetSimulado() {
      if (confirm("Tem certeza que deseja recomeçar o simulado do zero? Suas respostas atuais serão limpas.")) {
        simuladoAnswers = {};
        simuladoFinished = false;
        simuladoShowGabarito = false;
        currentSimuladoIndex = 0;
        try {
          localStorage.removeItem(KEY_SIMULADO_ANSWERS);
          localStorage.removeItem(KEY_SIMULADO_FINISHED);
        } catch(e) {}
        renderSimulados();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function downloadSimuladoReport() {
      const totalQ = simuladoQuestions.length;
      let correctCount = 0;
      simuladoQuestions.forEach((q, idx) => {
        if (simuladoAnswers[idx] === q.correct) correctCount++;
      });
      const pct = Math.round((correctCount / totalQ) * 100);
      const dataStr = new Date().toLocaleString("pt-BR");

      let report = `================================================================================\n`;
      report += `TCE-GO ELITE 2026/2027 • RELATÓRIO DO SIMULADO OFICIAL FCC\n`;
      report += `Plataforma de Estudos do Trio de Candidatos (Meta: 3 Vagas)\n`;
      report += `================================================================================\n\n`;
      report += `Data de Conclusão: ${dataStr}\n`;
      report += `Total de Questões: ${totalQ}\n`;
      report += `Total de Acertos:  ${correctCount} / ${totalQ} (${pct}%)\n`;
      report += `Total de Erros:    ${totalQ - correctCount} / ${totalQ}\n\n`;
      report += `--------------------------------------------------------------------------------\n`;
      report += `RESUMO DAS RESPOSTAS:\n`;
      report += `--------------------------------------------------------------------------------\n`;

      simuladoQuestions.forEach((q, idx) => {
        const user = simuladoAnswers[idx] || "Em branco";
        const status = user === q.correct ? "[ACERTOU]" : "[ERROU]  ";
        report += `Questão ${String(idx + 1).padStart(2, '0')}: Sua: ${user} | Gabarito: ${q.correct} ${status} - ${q.discipline}\n`;
      });

      report += `\n--------------------------------------------------------------------------------\n`;
      report += `DETALHAMENTO, ENUNCIADOS E COMENTÁRIOS DA BANCA:\n`;
      report += `--------------------------------------------------------------------------------\n\n`;

      simuladoQuestions.forEach((q, idx) => {
        const user = simuladoAnswers[idx] || "Não respondeu";
        report += `[QUESTÃO ${idx + 1}] • ${q.discipline}\n`;
        report += `${q.question}\n\n`;
        q.options.forEach(opt => {
          report += `  ${opt.letter}) ${opt.text}\n`;
        });
        report += `\n-> Sua resposta: ${user}\n`;
        report += `-> Gabarito Oficial: ${q.correct}\n`;
        report += `-> Comentário: ${q.comment}\n`;
        report += `\n--------------------------------------------------------------------------------\n\n`;
      });

      const blob = new Blob([report], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Gabarito-Simulado-FCC-TCEGO-${dataStr.replace(/[\/ :]/g, '_')}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

      const saved = localStorage.getItem(KEY_ESSAY) || "";
      container.innerHTML = `
        <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:20px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
            <h1 style="font-size:1.5rem; font-weight:800; color:#fff;">Editor de Redação FCC (30 Linhas)</h1>
            <span id="lines-badge" style="background:var(--bg-surface); padding:4px 12px; border-radius:999px; font-weight:800; color:var(--primary-light);">0 / 30 Linhas</span>
          </div>
          <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">Escreva ou cole seu rascunho de 30 linhas. O texto fica salvo automaticamente no seu navegador.</p>

          <div style="background:#090e1a; padding:12px; border-radius:var(--radius-sm); border-left:3px solid var(--gold); margin-bottom:14px; font-size:0.84rem; color:#cbd5e1;">
            <strong>🎯 Estrutura Padrão FCC:</strong><br>
            • Parágrafo 1 (Linhas 1 a 6): Introdução com contextualização e tese com 2 argumentos.<br>
            • Parágrafo 2 (Linhas 7 a 14): D1 - Aprofundamento do Argumento 1 com repertório (ex: John Rawls).<br>
            • Parágrafo 3 (Linhas 15 a 22): D2 - Aprofundamento do Argumento 2 com dados e controle social.<br>
            • Parágrafo 4 (Linhas 23 a 30): Conclusão com conectivo, síntese da tese e reflexão ética/cidadã.
          </div>

          <textarea class="essay-box" id="essay-text" placeholder="Comece sua redação aqui..." oninput="onEssayChange()">${saved}</textarea>

          <div style="display:flex; gap:10px; margin-top:12px;">
            <button class="btn-resume" onclick="localStorage.setItem(KEY_ESSAY, document.getElementById('essay-text').value); alert('Salvo no dispositivo com sucesso!')">💾 Salvar Rascunho</button>
            <button class="btn-resume" style="background:var(--bg-surface); color:#fff; border:1px solid var(--border-color);" onclick="if(confirm('Tem certeza que deseja limpar o texto?')){ document.getElementById('essay-text').value = ''; onEssayChange(); }">🗑️ Limpar</button>
          </div>
        </div>
      `;
      onEssayChange();
    }

    function onEssayChange() {
      const t = document.getElementById("essay-text");
      const b = document.getElementById("lines-badge");
      if (!t || !b) return;
      const count = t.value.split("\n").length;
      b.innerText = `${count} / 30 Linhas`;
      if (count >= 25 && count <= 30) {
        b.style.background = "var(--green)";
        b.style.color = "#064e3b";
      } else {
        b.style.background = "var(--bg-surface)";
        b.style.color = "var(--primary-light)";
      }
      localStorage.setItem(KEY_ESSAY, t.value);
    }

    function renderManual(container) {

        <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:20px;">
          <h1 style="font-size:1.5rem; font-weight:800; color:#fff; margin-bottom:8px;">Manual do Zero (Padeiro ao TCE-GO)</h1>
          <p style="font-size:0.9rem; color:#cbd5e1; line-height:1.6; margin-bottom:14px;">
            Você não precisa ter faculdade de Direito para conquistar sua vaga. Siga o roteiro passo a passo: comece pelo Nível 1, assista a uma aula por dia com o caderno na mão anotando os conceitos-chave, faça a sabatina do debate com seu trio no fim de semana para fixar a oratória e treine uma redação semanalmente no editor de 30 linhas.
          </p>
          <button class="btn-resume" onclick="showLevel(1)">▶ Começar Agora no Nível 1</button>

      `;

    function renderLinks(container) {

        <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:20px;">
          <h1 style="font-size:1.5rem; font-weight:800; color:#fff; margin-bottom:12px;">Links Oficiais do Concurso</h1>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <a href="https://www.concursosfcc.com.br/concursos/tcego125/edital_de_abertura_versaex771_o_15_09_2026_-_consolidado_com_retificacoes__1_.pdf" target="_blank" class="nav-item-btn" style="background:#090e1a; color:#fff;">📄 Edital Consolidado FCC (PDF) ↗</a>
            <a href="https://legisla.casacivil.go.gov.br/pesquisa_legislacao/102047/lei-20756" target="_blank" class="nav-item-btn" style="background:#090e1a; color:#fff;">🏛️ Estatuto dos Servidores de GO (Lei 20.756) ↗</a>
            <a href="https://legisla.casacivil.go.gov.br/pesquisa_legislacao/82155/lei-16168" target="_blank" class="nav-item-btn" style="background:#090e1a; color:#fff;">⚖️ Lei Orgânica do TCE-GO (Lei 16.168) ↗</a>
